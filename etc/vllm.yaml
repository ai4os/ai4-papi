---
# In non-quantized models, we have to specify "--dtype float16" because the default
# bfloat16 is only supported in GPUs with compute capability +8.0 (NVIDIA T4 has 7.5).

# Context len depends on the model size.
# For a tesla T4 16GB, to be on the safe side, use:
# * 32768 for <2B models
# * 16384 for 2B-<4B models
# * 8192 for 4B models (or larger quantized models)

# Non-quantized +4B model (at float16) won't deploy in a T4.
# This typically corresponds to 9GB of models weights

# **************************************************************************************
# Check vLLM recipes for optimal flags (tools, reasoning): https://recipes.vllm.ai/
# **************************************************************************************

models:

  # ====================================================================================

  Qwen/Qwen3.5-0.8B:
    name: 'Qwen3.5-0.8B'
    description: 'A 0.8B parameter instruction-tuned model from the Qwen 3.5 series, optimized for dialogue and general-purpose tasks.'
    family: 'Qwen'
    license: 'Apache 2.0'
    context: '32K'
    needs_HF_token: False
    args: [
      '--dtype', 'float16',
      '--max-model-len', '32768',
      '--enable-auto-tool-choice',
      '--tool-call-parser', 'qwen3_coder',
      '--reasoning-parser', 'qwen3',
      ]

  Qwen/Qwen3.5-2B:
