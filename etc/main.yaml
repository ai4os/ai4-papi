---
# Main configuration file of the API

self:  # info about the API endpoint

  domain: https://api.cloud.ai4eosc.eu

auth:

  CORS_origins:  # allows requests to the API from these domains

    - https://dashboard.dev.imagine-ai.eu
    - https://dashboard1.dev.imagine-ai.eu
    - https://dashboard.cloud.imagine-ai.eu
    - https://dashboard-stage.cloud.imagine-ai.eu

    - https://dashboard.dev.ai4eosc.eu
    - https://dashboard1.dev.ai4eosc.eu
    - https://dashboard.cloud.ai4eosc.eu
    - https://dashboard-stage.cloud.ai4eosc.eu

    - https://ai4life.cloud.ai4eosc.eu
    - https://kmd4eosc.cloud.ai4eosc.eu
    - https://dashboard.kmd4eosc.pcss.pl
    - https://tutorials.cloud.ai4eosc.eu
    - http://localhost:8080
    - ${DASHBOARD_URL}

  VO:  # Virtual Organizations

    - vo.ai4eosc.eu
    - vo.imagine-ai.eu
    - vo.ai4life.eu
    - kmd4eosc
    - tutorials

nomad:

  namespaces:  # map VO to Nomad namespace

    vo.ai4eosc.eu: ai4eosc
    vo.imagine-ai.eu: imagine
    vo.ai4life.eu: ai4life
    kmd4eosc: kmd4eosc
    tutorials: tutorials

lb:  # load balancer, Traefik

  domain:  # each VO accesses deployments through their domain

    vo.ai4eosc.eu: deployments.cloud.ai4eosc.eu
    vo.imagine-ai.eu: deployments.cloud.imagine-ai.eu
    vo.ai4life.eu: deployments.cloud.ai4eosc.eu
    kmd4eosc: deployments.cloud.ai4eosc.eu
    tutorials: deployments.cloud.ai4eosc.eu

oscar:

  clusters:

    vo.ai4eosc.eu:
      endpoint: https://inference.cloud.ai4eosc.eu
      cluster_id: oscar-ai4eosc-cluster

    vo.imagine-ai.eu:
      endpoint:  https://inference-walton.cloud.imagine-ai.eu
      cluster_id: oscar-imagine-cluster

    vo.ai4life.eu:
      endpoint: https://inference.cloud.ai4eosc.eu
      cluster_id: oscar-ai4eosc-cluster

    kmd4eosc:
      endpoint: https://inference.cloud.ai4eosc.eu
      cluster_id: oscar-ai4eosc-cluster

    tutorials:
      endpoint: https://inference.cloud.ai4eosc.eu
      cluster_id: oscar-ai4eosc-cluster

mlflow:

    vo.ai4eosc.eu: https://mlflow.cloud.ai4eosc.eu/
    vo.imagine-ai.eu: https://mlflow.cloud.imagine-ai.eu/
    vo.ai4life.eu: https://mlflow.cloud.ai4eosc.eu/
    kmd4eosc: https://mlflow.cloud.ai4eosc.eu/
    tutorials: https://mlflow.cloud.ai4eosc.eu/

energy:  # per-deployment energy consumption and environmental footprint stats

  enabled: true
  sweep_seconds: 900             # background thread cadence
  series_bucket_seconds: 900     # persisted time-series bucket size (matches Wattnet's 15-min cadence)
  query_step_seconds: 30         # Mimir scrape interval
  query_lag_seconds: 120         # ignore the most recent data (ingestion lag)
  initial_lookback_hours: 24     # window covered on a deployment's first sweep
  mimir_retention_days: 90       # tune to Mimir's actual retention
  footprint_revision_hours: 24   # re-compute footprint for buckets newer than this
  topup_cache_seconds: 25        # live top-up cache (< dashboard poll so the counter moves)
  deployment_series_points: 1000 # downsample target for the per-deployment series in /deployments/*
  user_series_points: 1000       # downsample target for the merged per-user series in /stats/user (full_info=true)
  cluster_series_points: 500     # downsample target for the per-datacenter series in /stats/cluster (full_info=true)

  metrics_datacenters:  # datacenters where power metrics exist

    - ifca-ai4eosc
    - ifca-imagine

  # TUE (grid -> compute ratio, already covers CPU+GPU) is read per-datacenter
  # from the `TUE` column of var/datacenters.csv; this is the fallback for
  # datacenters that do not have it yet.
  default_tue_factor: 2.73

  data_quality:  # drop anomalous samples from each source series before integrating

    enabled: true
    min_power_w: 0             # drop samples below this (kills negatives)
    max_power_w: 1000          # per-source ceiling (one allocation's CPU, or one GPU); 0 = off
    spike_factor: 12           # drop a sample above spike_factor * rolling median (0 = off)
    spike_window: 11           # neighbour samples used for the rolling median
