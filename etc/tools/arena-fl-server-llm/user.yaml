---
# User customizable configuration for the ARENA federated LLM server.
general:
  title:
    name: Deployment title
    value: ''
    description: Provide short title for this deployment (less than 45 characters). Useful when you have lots of different active deployments.

  desc:
    name: Deployment description
    value: ''
    description: Provide some additional extended information about this deployment.

  co2:
    name: CO2 emissions monitoring
    value: False
    options: [True, False]

  docker_image:
    name: Docker image
    value: 'sainzpardo/arena-fl-server-llm:v0.1'
    description: Docker image to be used.

  service:
    name: Service to run
    value: 'fedserver'
    description: When selecting FedServer, you won't be able to use JupyterLab/VScode, and vice versa. To access both services, deploy JupyterLab/VScode and start the SuperLink from a terminal with `cd /srv/arena-fl-server-llm && ./start_superlink.sh`.
    options: ['fedserver', 'jupyter', 'vscode']

  jupyter_password:
    name: IDE password
    value: ''
    description: Select a password for your IDE (JupyterLab or VS Code). It should have at least 9 characters.

hardware:
  cpu_num:
    name: Number of CPUs
    value: 1
    range: [1, 2]

  ram:
    name: RAM memory (in MB)
    value: 2000
    range: [2000, 8000]

  disk:
    name: Disk memory (in MB)
    value: 1000
    range: [1000, 2000]

fedllm:
  num_rounds:
    name: Number of federated rounds
    value: 10
    range: [1, null]

  model_name:
    name: Base model
    value: 'Qwen/Qwen2.5-0.5B'

  model_quantization:
    name: Model quantization
    value: 4
    options: [4, 8]

  num_epochs:
    name: Number of local training epochs
    value: 3
    range: [1, null]

  fraction_train:
    name: Fraction of clients used for training
    value: 0.2
    range: [0.0, 1.0]

  fraction_evaluate:
    name: Fraction of clients used for evaluation
    value: 0.0
    range: [0.0, 1.0]
